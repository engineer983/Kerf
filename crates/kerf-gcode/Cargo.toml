[package]
name = "kerf-gcode"
description = "SVG and raster to G-code generation for Kerf"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
usvg = { version = "0.45.1", default-features = false, features = ["text"] }

# A browser has no installed fonts to read; there they are handed over instead.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
usvg = { version = "0.45.1", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
