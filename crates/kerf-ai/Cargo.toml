[package]
name = "kerf-ai"
description = "Model providers, tool calling and MCP client for the Kerf assistant"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
ureq = { version = "2", features = ["json"], optional = true }
base64 = "0.22"

[features]
default = ["http"]
# Makes the requests itself. Without it (in a browser) the caller is handed
# each request to make, and hands back the reply.
http = ["dep:ureq"]
