[workspace]
resolver = "2"
members = ["src-tauri", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Tracing and toolpath generation are far too slow unoptimised, so these are
# built with optimisation even in development.
[profile.dev.package.kerf-gcode]
opt-level = 3

[profile.dev.package.kerf-trace]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.visioncortex]
opt-level = 3

[profile.dev.package.vtracer]
opt-level = 3
